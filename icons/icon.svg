<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<!-- Source for icon16/32/48/128.png: a magnifier drawn as a Q ("Cue"); the amber handle is the Q's tail and echoes the found-moment marker.
     The navy layer underneath outlines the Q so the amber and white stay distinct at 16 px. -->
