<circle cx="56" cy="56" r="28" fill="none" stroke="#0b2a7a" stroke-width="21"/>
<path d="M66 66 L100 100" stroke="#0b2a7a" stroke-width="23" stroke-linecap="round"/>
<circle cx="56" cy="56" r="28" fill="none" stroke="#fff" stroke-width="13"/>
<path d="M66 66 L100 100" stroke="#f5b301" stroke-width="15" stroke-linecap="round"/>
</svg>
