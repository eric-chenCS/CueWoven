<!doctype html>
<html lang="en">
  <head><script src="../styles/theme.js"></script>
    <meta charset="utf-8" />
    <title>CueWoven v3.3.31</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand" title="CueWoven v3.3.31">
        <img src="../icons/icon32.png" alt="" width="20" height="20" />
        <span>CueWoven</span>
      </div>
      <span id="status" class="status" aria-live="polite"></span>
    </header>

    <section id="start-choice" class="start-choice" aria-labelledby="start-heading" hidden>
      <h2 id="start-heading">Fill your library</h2>

      <div class="start-actions">
        <button id="start-restore" class="btn small">Restore backup</button>
        <button id="start-empty" class="btn ghost small">Start empty</button>
        <button id="start-samples" class="btn ghost small">Try sample videos</button>
      </div>
    </section>

    <div class="search-row">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Describe a memory, then press Enter" aria-label="Search your CueWoven library" />
      </div>
    </div>
    <div id="clues" class="clues" aria-label="Added to this search" hidden></div>

    <div class="filter-row">
      <div class="filters" role="radiogroup" aria-label="Watched within">
        <button class="chip" role="radio" aria-checked="true" data-days="0">Any time</button>
        <button class="chip" role="radio" aria-checked="false" data-days="1">Today</button>
        <button class="chip" role="radio" aria-checked="false" data-days="7">7 days</button>
        <button class="chip" role="radio" aria-checked="false" data-days="30">30 days</button>
        <button class="chip" role="radio" aria-checked="false" data-days="custom" aria-controls="custom-range">Custom</button>
      </div>
      <div class="source-options">
        <label for="kind-filter" class="visually-hidden">Show</label>
        <select id="kind-filter" aria-label="Show results from">
          <option value="all">Everything</option>
          <option value="video">Videos</option>
          <option value="page">Pages</option>
          <option value="search">Searches</option>
        </select>
      </div>
    </div>
    <div id="custom-range" class="custom-range" role="group" aria-label="Watched or saved between" hidden>
      <label>From <input type="date" id="range-from" /></label>
      <label>To <input type="date" id="range-to" /></label>
    </div>

    <div class="search-extras">
      <label id="video-scope-row" class="view-option" hidden><input id="video-scope" type="checkbox" /> Search this video</label>
    </div>
    <div class="notices">
        <p id="applied-filters" class="notice" role="status" hidden></p>
        <button id="ignore-inferred" class="link-btn" hidden>Ignore suggested filters</button>
        <p id="hidden-note" class="notice" role="status" hidden><span id="hidden-text"></span> <button id="hidden-undo" class="link-btn" type="button">Undo</button></p>
      <button id="search-retry" class="btn small" hidden>Retry</button>
      <p id="scene-status" class="notice" role="status" aria-live="polite" hidden></p>
      <p id="ocr-status" class="notice" role="status" aria-live="polite" hidden></p>
      <p id="embedding-status" class="notice" role="status" aria-live="polite" hidden></p>
      <div id="model" class="notice model" hidden>
        <div class="model-text" id="model-text">Loading the search model…</div>
        <div class="bar"><div id="model-bar"></div></div>
      </div>
    </div>

    <main id="results" class="results" aria-live="polite"></main>
    <section id="refine" class="refine" aria-label="Add a detail to this search" hidden>
      <button id="refine-toggle" class="link-btn" type="button" aria-expanded="false" aria-controls="refine-panel">Not it? Add a detail</button>
      <div id="refine-panel" class="refine-panel" hidden>
        <div class="refine-hints" role="group" aria-label="What do you remember?">
          <button type="button" class="hint-chip" aria-pressed="false" data-hint="What did they say? e.g. lithium gets trapped">Something said</button>
          <button type="button" class="hint-chip" aria-pressed="false" data-hint="What was on screen? e.g. a red car, a whiteboard">On screen</button>
          <button type="button" class="hint-chip" aria-pressed="false" data-hint="Which channel or site? e.g. Veritasium, from TikTok">Channel or site</button>
          <button type="button" class="hint-chip" aria-pressed="false" data-hint="When? e.g. 3 days ago, between 1 and 2 months ago">When</button>
        </div>
        <label for="details" class="visually-hidden">A detail you remember</label>
        <input id="details" type="text" maxlength="300" autocomplete="off" spellcheck="false" placeholder="Add a detail you remember, then press Enter" />
      </div>
    </section>

    <section class="tab-tools" aria-label="This tab">
      <p id="capture-indicator" class="tab-caption" role="status" hidden></p>
      <div id="index-now" class="tab-item" hidden>
        <span class="tab-label">This video</span>
        <span id="index-now-text" class="tab-text"></span>
        <button id="index-now-btn" class="btn small">Save now</button>
      </div>

      <section id="page-capture" class="tab-item page-capture" aria-label="This page" hidden>
        <span class="tab-label">This page</span>
        <p id="page-capture-status" class="tab-text" role="status"></p>
        <div class="tab-actions"><button id="page-save-now" class="btn ghost small">Save page</button><button id="page-forget" class="btn ghost small" title="Delete what CueWoven saved from this site and stop saving it">Forget site</button></div>
      </section>

      <details id="speech" class="speech" hidden>
        <summary id="speech-heading">Speech-to-text</summary>
        <div class="speech-body">
          <p class="hint">English player audio, on this device. Only played portions are saved. First use downloads a model.</p>
          <p id="speech-status" role="status" aria-live="polite"></p>
          <div class="speech-actions"><button id="speech-start" class="btn ghost small">Start English transcription</button><button id="speech-stop" class="btn small" hidden>Stop</button></div>
        </div>
      </details>
    </section>

    <footer class="foot">
      <span class="foot-actions">
        <button id="web-pause-popup" class="link-btn" hidden>Stop saving sites</button>
        <a href="#" id="open-library">Library &amp; settings</a>
      </span>
    </footer>

    <template id="result-tpl">
      <div class="result-wrap">
      <a class="result" href="#" tabindex="0">
        <div class="thumb">
          <img alt="" loading="lazy" />
          <span class="time"></span>
        </div>
        <div class="body">
          <div class="title"></div>
          <div class="snippet"></div>
          <div class="match-sources" aria-label="Matched in"></div>
          <div class="meta"></div>
        </div>
      </a>
      <div class="result-actions">
        <button class="not-this icon-btn" type="button" aria-label="Not this one" title="Not this one: hide it and search again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.7 5.1A9.7 9.7 0 0 1 12 5c6 0 10 7 10 7a17.6 17.6 0 0 1-2.9 3.6M6.6 6.6C3.9 8.3 2 12 2 12s4 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg></button>
        <button class="copy-link icon-btn" type="button" aria-label="Copy link to this moment" title="Copy link to this moment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1.5-1.5"/></svg></button>
      </div>
      </div>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
